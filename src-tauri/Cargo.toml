[package]
name = "riptag"
version = "0.1.0"
description = "Rip CDs and repair music libraries for the FiiO Snowsky Echo Mini"
authors = ["Miko Zyzanski"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "riptag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25.5"
walkdir = "2.5.0"
unicode-normalization = "0.1.26"
tauri-plugin-dialog = "2.8.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
ureq = { version = "3.5.0", features = ["json"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["disk"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
